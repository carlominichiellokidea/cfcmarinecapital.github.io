  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — blueprint frame: components are wireframe objects (see .blueprint\n     and .corner above) — square, transparent, hairline-bordered — */\n.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }\n.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }\n.btn { border: 1px solid var(--color-divider); }\n.btn-primary { border-color: var(--color-accent); }\n.btn-ghost { border-color: transparent; }\n\n<\u002Fstyle>\n<script src=\"f69a9bde-1591-4272-adf7-11fb0554e5ce\"><\u002Fscript>\n<script src=\"34a6dcbb-6f95-4039-be30-378267b25735\"><\u002Fscript>\n<style>\n  html { scroll-behavior: smooth; }\n  body { margin: 0; text-wrap: pretty; }\n  a { color: var(--color-accent); }\n  a:hover { color: var(--color-accent-700); }\n<\u002Fstyle>\n\n<\u002Fhelmet>\n\n<div style=\"background:var(--color-bg);color:var(--color-text);\">\n\n  <nav class=\"nav\" style=\"position:sticky;top:0;z-index:10;background:color-mix(in srgb, var(--color-bg) 92%, transparent);backdrop-filter:blur(6px);padding-inline:clamp(20px,5vw,72px);border-bottom:1px solid var(--color-divider);\">\n    <span class=\"nav-brand\">CFC Marine Capital<\u002Fspan>\n    <a href=\"#chi-siamo\">Chi siamo<\u002Fa>\n    <a href=\"#servizi\">Servizi<\u002Fa>\n    <a href=\"#imbarcazioni\">Imbarcazioni<\u002Fa>\n    <a href=\"#destinazioni\">Destinazioni<\u002Fa>\n    <a href=\"#contatti\">Contatti<\u002Fa>\n    <a href=\"#form\"><button type=\"button\" class=\"btn btn-primary\">Richiedi informazioni<\u002Fbutton><\u002Fa>\n  <\u002Fnav>\n\n  <!-- HERO SLIDER (full-bleed) -->\n  <section style=\"position:relative;height:100vh;min-height:560px;overflow:hidden;background:var(--color-accent-900);\">\n    <sc-for list=\"{{ heroImages }}\" as=\"img\" hint-placeholder-count=\"6\">\n      <div role=\"img\" aria-label=\"{{ img.alt }}\" style=\"{{ img.style }}\"><\u002Fdiv>\n    <\u002Fsc-for>\n    <div style=\"position:absolute;inset:0;background:var(--color-accent);mix-blend-mode:color;pointer-events:none;\"><\u002Fdiv>\n    <div style=\"position:absolute;inset:0;background:linear-gradient(to bottom, color-mix(in srgb, var(--color-accent-900) 30%, transparent) 0%, color-mix(in srgb, var(--color-accent-900) 75%, transparent) 100%);pointer-events:none;\"><\u002Fdiv>\n    <i class=\"corner tl\" style=\"position:absolute;top:24px;left:24px;width:15px;height:15px;color:#f2f2f3;\"><\u002Fi>\n    <i class=\"corner tr\" style=\"position:absolute;top:24px;right:24px;width:15px;height:15px;color:#f2f2f3;\"><\u002Fi>\n    <i class=\"corner bl\" style=\"position:absolute;bottom:24px;left:24px;width:15px;height:15px;color:#f2f2f3;\"><\u002Fi>\n    <i class=\"corner br\" style=\"position:absolute;bottom:24px;right:24px;width:15px;height:15px;color:#f2f2f3;\"><\u002Fi>\n    <div style=\"position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:flex-end;max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,72px) 88px;\">\n      <h1 style=\"font-family:var(--font-heading);font-weight:600;text-transform:uppercase;font-size:clamp(40px,6.5vw,84px);line-height:1.04;letter-spacing:0.01em;margin:0;color:#f2f2f3;\">Il mare, al tuo ritmo.<\u002Fh1>\n      <p style=\"font-size:18px;line-height:1.6;max-width:62ch;margin:28px 0 0;color:color-mix(in srgb, #f2f2f3 88%, transparent);\">CFC Marine Capital organizza charter con skipper in Costiera Amalfitana e affianca chi sceglie un gommone BAT di grandi dimensioni. Un unico interlocutore, un servizio pensato su misura per te.<\u002Fp>\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:32px;\">\n        <a href=\"#form\"><button type=\"button\" class=\"btn btn-primary\" style=\"font-size:15px;padding:12px 24px;\">Richiedi informazioni<\u002Fbutton><\u002Fa>\n        <a href=\"#imbarcazioni\"><button type=\"button\" class=\"btn\" style=\"font-size:15px;padding:12px 20px;border-color:color-mix(in srgb, #f2f2f3 40%, transparent);color:#f2f2f3;\">Scopri la flotta<\u002Fbutton><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:absolute;bottom:28px;left:50%;transform:translateX(-50%);z-index:3;display:flex;gap:8px;\">\n      <sc-for list=\"{{ dots }}\" as=\"dot\" hint-placeholder-count=\"6\">\n        <button type=\"button\" sc-camel-on-click=\"{{ dot.onClick }}\" aria-label=\"Vai alla foto\" style=\"{{ dot.style }}\"><\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div style=\"max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,72px);\">\n\n    <!-- CHI SIAMO -->\n    <section id=\"chi-siamo\" style=\"display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:24px clamp(24px,5vw,80px);align-items:center;padding:48px 0 72px;\">\n      <div>\n        <span style=\"display:block;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;color:var(--color-accent-700);margin-bottom:12px;\">01 · Chi siamo<\u002Fspan>\n        <hr style=\"height:1px;border:0;margin:0 0 24px;background:var(--color-divider);\">\n        <h2 style=\"font-size:32px;text-transform:uppercase;letter-spacing:0.02em;margin:0 0 16px;\">Chi è CFC Marine Capital<\u002Fh2>\n        <p style=\"font-size:16px;line-height:1.6;margin:0 0 16px;color:color-mix(in srgb, var(--color-text) 82%, transparent);\">CFC Marine Capital nasce dalla passione per il mare e dalla ricerca costante dell'eccellenza nel mondo della nautica di lusso. Operiamo lungo la Costiera Amalfitana con due anime complementari: il charter e noleggio con skipper di imbarcazioni Scarab e Rizzardi CR63, e la vendita di gommoni BAT, partner strategico ed eccellenza nel segmento dei gommoni di grandi dimensioni.<\u002Fp>\n        <p style=\"font-size:16px;line-height:1.6;margin:0;color:color-mix(in srgb, var(--color-text) 82%, transparent);\">Ogni collaborazione nasce da un ascolto attento e si costruisce su competenza tecnica, cura del dettaglio e un servizio realmente su misura. Che tu stia organizzando un'uscita in mare o valutando l'acquisto di un'imbarcazione, il principio resta lo stesso: il vero lusso è vivere il mare al tuo ritmo.<\u002Fp>\n      <\u002Fdiv>\n      <figure class=\"blueprint\" style=\"margin:0;\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <div style=\"width:100%;aspect-ratio:4/5;\">\n          <image-slot id=\"chi-siamo-photo\" shape=\"rect\" placeholder=\"Foto: imbarcazione in Costiera Amalfitana\" style=\"width:100%;height:100%;\" src=\"f4d8bea2-6111-4d8d-b944-ad68cbe6317a\"><\u002Fimage-slot>\n        <\u002Fdiv>\n      <\u002Ffigure>\n    <\u002Fsection>\n\n    <!-- SERVIZI -->\n    <section id=\"servizi\" style=\"padding:48px 0 72px;\">\n      <span style=\"display:block;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;color:var(--color-accent-700);margin-bottom:12px;\">02 · Cosa facciamo — I nostri servizi<\u002Fspan>\n      <hr style=\"height:1px;border:0;margin:0 0 32px;background:var(--color-divider);\">\n      <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(20px,3vw,48px);\">\n        <div class=\"blueprint\" style=\"padding:28px;\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <h3 style=\"font-size:24px;text-transform:uppercase;letter-spacing:0.02em;margin:0 0 12px;\">Charter e noleggio con skipper<\u002Fh3>\n          <p style=\"font-size:15px;line-height:1.6;margin:0 0 16px;color:color-mix(in srgb, var(--color-text) 82%, transparent);\">Vivi la Costiera Amalfitana, Capri e Positano a bordo di imbarcazioni selezionate, con skipper professionista incluso. Ci raccontano cosa desiderano vivere in mare, e organizziamo l'uscita di conseguenza: dalla giornata classica alle esperienze private.<\u002Fp>\n          <ul style=\"margin:0 0 20px;padding-left:20px;font-size:14px;line-height:1.8;color:color-mix(in srgb, var(--color-text) 82%, transparent);\">\n            <li>Skipper professionista sempre incluso<\u002Fli>\n            <li>Imbarcazioni Scarab e Rizzardi CR63<\u002Fli>\n            <li>Esperienze personalizzabili: pranzi a bordo, aperitivi al tramonto, eventi privati<\u002Fli>\n            <li>Partenze da Salerno e Amalfi<\u002Fli>\n          <\u002Ful>\n          <a href=\"#form\"><button type=\"button\" class=\"btn btn-secondary\">Richiedi un preventivo per il tuo charter<\u002Fbutton><\u002Fa>\n        <\u002Fdiv>\n        <div class=\"blueprint\" style=\"padding:28px;\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <h3 style=\"font-size:24px;text-transform:uppercase;letter-spacing:0.02em;margin:0 0 12px;\">Vendita gommoni BAT<\u002Fh3>\n          <p style=\"font-size:15px;line-height:1.6;margin:0 0 16px;color:color-mix(in srgb, var(--color-text) 82%, transparent);\">Siamo partner strategico ed eccellenza italiana nella vendita di gommoni BAT di grandi dimensioni. Ti affianchiamo nella scelta dell'imbarcazione più adatta, con la consulenza tecnica e commerciale di chi vive ogni giorno questo mondo: dalla selezione del modello alla personalizzazione, fino alla consegna.<\u002Fp>\n          <ul style=\"margin:0 0 20px;padding-left:20px;font-size:14px;line-height:1.8;color:color-mix(in srgb, var(--color-text) 82%, transparent);\">\n            <li>Gamma di gommoni BAT di grandi dimensioni<\u002Fli>\n            <li>Consulenza personalizzata pre e post vendita<\u002Fli>\n            <li>Interlocutore unico per acquisto, personalizzazione e assistenza<\u002Fli>\n          <\u002Ful>\n          <a href=\"#form\"><button type=\"button\" class=\"btn btn-secondary\">Parla con noi per la tua prossima imbarcazione<\u002Fbutton><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- IMBARCAZIONI -->\n    <section id=\"imbarcazioni\" style=\"padding:48px 0 72px;\">\n      <span style=\"display:block;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;color:var(--color-accent-700);margin-bottom:12px;\">03 · Le imbarcazioni<\u002Fspan>\n      <hr style=\"height:1px;border:0;margin:0 0 32px;background:var(--color-divider);\">\n\n      <div style=\"display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:24px clamp(24px,5vw,64px);align-items:stretch;margin-bottom:48px;\">\n        <div class=\"blueprint\" style=\"position:relative;\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <header style=\"display:flex;flex-wrap:wrap;border-bottom:1px solid var(--color-divider);\">\n            <span style=\"flex:1;min-width:16ch;padding:12px 24px;font-size:13px;line-height:24px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;\">Rizzardi CR63 — Luxury Charter Experience<\u002Fspan>\n            <span style=\"border-left:1px solid var(--color-divider);padding:12px 24px;font-size:13px;line-height:24px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;white-space:nowrap;color:color-mix(in srgb, var(--color-text) 70%, transparent);\">Scheda tecnica<\u002Fspan>\n          <\u002Fheader>\n          <p style=\"font-size:15px;line-height:1.6;margin:0;padding:20px 24px 0;color:color-mix(in srgb, var(--color-text) 82%, transparent);\">Un'esclusiva combinazione di eleganza italiana, comfort e prestazioni. A bordo del Rizzardi CR63, Costiera Amalfitana, Capri e Positano si vedono da una prospettiva diversa dal solito.<\u002Fp>\n          <sc-raw-table class=\"table\" style=\"width:100%;border-collapse:collapse;font-size:14px;margin-top:16px;\">\n            <sc-raw-tbody>\n              <sc-raw-tr><sc-raw-td style=\"padding:8px 24px;border-bottom:1px solid color-mix(in srgb, var(--color-text) 8%, transparent);color:color-mix(in srgb, var(--color-text) 70%, transparent);\">Lunghezza<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 24px 8px 0;border-bottom:1px solid color-mix(in srgb, var(--color-text) 8%, transparent);font-family:var(--font-heading);font-weight:600;\">19,20 m<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td style=\"padding:8px 24px;border-bottom:1px solid color-mix(in srgb, var(--color-text) 8%, transparent);color:color-mix(in srgb, var(--color-text) 70%, transparent);\">Larghezza<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 24px 8px 0;border-bottom:1px solid color-mix(in srgb, var(--color-text) 8%, transparent);font-family:var(--font-heading);font-weight:600;\">4,95 m<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td style=\"padding:8px 24px;border-bottom:1px solid color-mix(in srgb, var(--color-text) 8%, transparent);color:color-mix(in srgb, var(--color-text) 70%, transparent);\">Motori<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 24px 8px 0;border-bottom:1px solid color-mix(in srgb, var(--color-text) 8%, transparent);font-family:var(--font-heading);font-weight:600;\">2× MAN 1200 HP<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td style=\"padding:8px 24px;border-bottom:1px solid color-mix(in srgb, var(--color-text) 8%, transparent);color:color-mix(in srgb, var(--color-text) 70%, transparent);\">Velocità di crociera<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 24px 8px 0;border-bottom:1px solid color-mix(in srgb, var(--color-text) 8%, transparent);font-family:var(--font-heading);font-weight:600;\">28 nodi<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td style=\"padding:8px 24px;border-bottom:1px solid color-mix(in srgb, var(--color-text) 8%, transparent);color:color-mix(in srgb, var(--color-text) 70%, transparent);\">Velocità massima<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 24px 8px 0;border-bottom:1px solid color-mix(in srgb, var(--color-text) 8%, transparent);font-family:var(--font-heading);font-weight:600;\">35 nodi<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td style=\"padding:8px 24px;border-bottom:1px solid color-mix(in srgb, var(--color-text) 8%, transparent);color:color-mix(in srgb, var(--color-text) 70%, transparent);\">Ospiti · Cabine · Bagni<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 24px 8px 0;border-bottom:1px solid color-mix(in srgb, var(--color-text) 8%, transparent);font-family:var(--font-heading);font-weight:600;\">12 · 3 · 2<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n          <p style=\"font-size:13px;line-height:1.6;margin:0;padding:16px 24px;border-top:1px solid var(--color-divider);color:color-mix(in srgb, var(--color-text) 70%, transparent);\">Dotazioni: prendisole di prua, aria condizionata, Wi-Fi, cucina attrezzata, impianto audio premium, tender e attrezzature per l'acqua.<\u002Fp>\n        <\u002Fdiv>\n        <figure class=\"blueprint\" style=\"margin:0;display:flex;flex-direction:column;min-height:0;\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <div role=\"img\" aria-label=\"{{ cr63.alt }}\" style=\"{{ cr63.mainStyle }}\"><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--color-divider);border-top:1px solid var(--color-divider);\">\n            <sc-for list=\"{{ cr63.thumbs }}\" as=\"t\" hint-placeholder-count=\"8\">\n              <button type=\"button\" aria-label=\"Mostra foto\" sc-camel-on-click=\"{{ t.onClick }}\" style=\"{{ t.style }}\"><\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Ffigure>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(20px,3vw,48px);\">\n        <div class=\"blueprint\" style=\"padding:0;min-width:0;\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <div role=\"img\" aria-label=\"{{ scarab.alt }}\" style=\"{{ scarab.mainStyle }}\"><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--color-divider);border-block:1px solid var(--color-divider);\">\n            <sc-for list=\"{{ scarab.thumbs }}\" as=\"t\" hint-placeholder-count=\"6\">\n              <button type=\"button\" aria-label=\"Mostra foto\" sc-camel-on-click=\"{{ t.onClick }}\" style=\"{{ t.style }}\"><\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"padding:28px;\">\n            <h3 style=\"font-size:22px;text-transform:uppercase;letter-spacing:0.02em;margin:0 0 12px;\">Scarab<\u002Fh3>\n            <p style=\"font-size:15px;line-height:1.6;margin:0;color:color-mix(in srgb, var(--color-text) 82%, transparent);\">Per chi preferisce velocità e dinamismo in ogni uscita in mare. Lo Scarab è la scelta ideale per vivere la costa in modo più diretto, senza rinunciare al comfort di un'imbarcazione curata nei dettagli.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"blueprint\" style=\"padding:0;min-width:0;\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <div role=\"img\" aria-label=\"{{ bat.alt }}\" style=\"{{ bat.mainStyle }}\"><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--color-divider);border-block:1px solid var(--color-divider);\">\n            <sc-for list=\"{{ bat.thumbs }}\" as=\"t\" hint-placeholder-count=\"7\">\n              <button type=\"button\" aria-label=\"Mostra foto\" sc-camel-on-click=\"{{ t.onClick }}\" style=\"{{ t.style }}\"><\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"padding:28px;\">\n            <h3 style=\"font-size:22px;text-transform:uppercase;letter-spacing:0.02em;margin:0 0 12px;\">Gommoni BAT<\u002Fh3>\n            <p style=\"font-size:15px;line-height:1.6;margin:0;color:color-mix(in srgb, var(--color-text) 82%, transparent);\">Eccellenza nel segmento dei gommoni di grandi dimensioni: robustezza, prestazioni e finiture pensate per un uso premium, sia privato che professionale (charter).<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- DESTINAZIONI -->\n    <section id=\"destinazioni\" style=\"padding:48px 0 72px;\">\n      <span style=\"display:block;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;color:var(--color-accent-700);margin-bottom:12px;\">04 · Le destinazioni<\u002Fspan>\n      <hr style=\"height:1px;border:0;margin:0 0 32px;background:var(--color-divider);\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--color-divider);border:1px solid var(--color-divider);\">\n        <sc-for list=\"{{ destinations }}\" as=\"dest\" hint-placeholder-count=\"5\">\n          <div style=\"background:var(--color-bg);padding:24px;\">\n            <h4 style=\"font-size:18px;text-transform:uppercase;letter-spacing:0.02em;margin:0 0 8px;\">{{ dest.name }}<\u002Fh4>\n            <p style=\"font-size:14px;line-height:1.6;margin:0;color:color-mix(in srgb, var(--color-text) 78%, transparent);\">{{ dest.desc }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ESPERIENZE SU MISURA -->\n    <section style=\"padding:48px 0 72px;\">\n      <span style=\"display:block;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;color:var(--color-accent-700);margin-bottom:12px;\">05 · Esperienze su misura<\u002Fspan>\n      <hr style=\"height:1px;border:0;margin:0 0 24px;background:var(--color-divider);\">\n      <p style=\"font-size:16px;line-height:1.6;max-width:60ch;margin:0 0 24px;color:color-mix(in srgb, var(--color-text) 82%, transparent);\">Ogni momento può diventare un'occasione. Raccontaci cosa hai in mente, lo organizziamo insieme.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:10px;\">\n        <sc-for list=\"{{ experiences }}\" as=\"exp\" hint-placeholder-count=\"6\">\n          <span class=\"tag tag-outline\" style=\"font-size:13px;padding:8px 16px;\">{{ exp }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- FORM -->\n    <section id=\"form\" style=\"padding:48px 0 72px;\">\n      <span style=\"display:block;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;color:var(--color-accent-700);margin-bottom:12px;\">06 · Richiedi informazioni<\u002Fspan>\n      <hr style=\"height:1px;border:0;margin:0 0 24px;background:var(--color-divider);\">\n      <h2 style=\"font-size:28px;text-transform:uppercase;letter-spacing:0.02em;margin:0 0 12px;\">Richiedi informazioni<\u002Fh2>\n      <p style=\"font-size:16px;line-height:1.6;max-width:60ch;margin:0 0 32px;color:color-mix(in srgb, var(--color-text) 82%, transparent);\">Raccontaci cosa stai cercando — un charter, l'acquisto di un gommone BAT o un'esperienza su misura — e ti risponderemo con un preventivo personalizzato entro 24 ore.<\u002Fp>\n\n      <sc-if value=\"{{ !submitted }}\" hint-placeholder-val=\"{{ true }}\">\n        <form sc-camel-on-submit=\"{{ handleSubmit }}\" style=\"max-width:640px;display:flex;flex-direction:column;gap:20px;\">\n          <div class=\"field\">\n            <label>Nome e cognome *<\u002Flabel>\n            <input class=\"input\" type=\"text\" required=\"\" placeholder=\"Nome e cognome\">\n          <\u002Fdiv>\n          <div class=\"field\">\n            <label>Email *<\u002Flabel>\n            <input class=\"input\" type=\"email\" required=\"\" placeholder=\"nome@esempio.it\">\n          <\u002Fdiv>\n          <div class=\"field\">\n            <label>Sono interessato a *<\u002Flabel>\n            <sc-raw-select class=\"input\" required=\"\">\n              <option value=\"\">Seleziona un'opzione<\u002Foption>\n              <option>Charter / noleggio con skipper<\u002Foption>\n              <option>Acquisto gommone BAT<\u002Foption>\n              <option>Esperienza su misura (evento, matrimonio, transfer)<\u002Foption>\n              <option>Altro<\u002Foption>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;\">\n            <div class=\"field\">\n              <label>Data indicativa (facoltativo)<\u002Flabel>\n              <input class=\"input\" type=\"date\">\n            <\u002Fdiv>\n            <div class=\"field\">\n              <label>Numero di ospiti (facoltativo)<\u002Flabel>\n              <input class=\"input\" type=\"number\" min=\"1\" placeholder=\"Solo per charter\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"field\">\n            <label>Messaggio<\u002Flabel>\n            <textarea class=\"input\" rows=\"4\" placeholder=\"Raccontaci di più sulla tua richiesta\"><\u002Ftextarea>\n          <\u002Fdiv>\n          <label style=\"display:flex;align-items:flex-start;gap:10px;font-size:13px;line-height:1.5;color:color-mix(in srgb, var(--color-text) 78%, transparent);\">\n            <input type=\"checkbox\" required=\"\" style=\"margin-top:3px;\">\n            <span>Ho letto e accetto l'<a href=\"#\">informativa sulla privacy<\u002Fa> *<\u002Fspan>\n          <\u002Flabel>\n          <div>\n            <button type=\"submit\" class=\"btn btn-primary\" style=\"font-size:15px;padding:12px 28px;\">Invia richiesta<\u002Fbutton>\n          <\u002Fdiv>\n          <p style=\"font-size:13px;color:color-mix(in srgb, var(--color-text) 60%, transparent);margin:0;\">Nessun impegno: la richiesta di informazioni non comporta alcuna prenotazione.<\u002Fp>\n        <\u002Fform>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"blueprint\" style=\"max-width:640px;padding:28px;\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <p style=\"font-size:16px;line-height:1.6;margin:0;\">Grazie per averci contattato. Il nostro team ti risponderà al più presto con tutte le informazioni richieste.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n    <!-- CONTATTI / FOOTER -->\n    <footer id=\"contatti\" style=\"padding:48px 0 40px;border-top:1px solid var(--color-divider);\">\n      <p style=\"font-family:var(--font-heading);font-weight:600;font-size:22px;text-transform:uppercase;letter-spacing:0.02em;margin:0 0 20px;\">CFC Marine Capital<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:32px;font-size:14px;color:color-mix(in srgb, var(--color-text) 78%, transparent);margin-bottom:32px;\">\n        <span>Tel: <a href=\"tel:0656556137\">056 6556137<\u002Fa><\u002Fspan>\n        <span>Email: <a href=\"mailto:info@cfcmarinecapital.it\">info@cfcmarinecapital.it<\u002Fa><\u002Fspan>\n        <span>Porto di imbarco: Salerno / Amalfi<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"font-family:var(--font-heading);font-weight:600;font-size:18px;text-transform:uppercase;letter-spacing:0.02em;margin:0 0 24px;\">Il vero lusso è vivere il mare al tuo ritmo.<\u002Fp>\n      <p style=\"font-size:12px;color:color-mix(in srgb, var(--color-text) 55%, transparent);margin:0;\">© CFC Marine Capital<\u002Fp>\n    <\u002Ffooter>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { submitted: false, slide: 0 };\n\n  heroPhotos = [\n    { src: 'uploads/fwdrizzardicr63/1000554483.jpg', alt: 'Rizzardi CR63 — prendisole di prua' },\n    { src: 'uploads/fwdrizzardicr63/1000554492.jpg', alt: 'Rizzardi CR63 all\\'ormeggio' },\n    { src: 'uploads/fwdrizzardicr63/1000522453.jpg', alt: 'Rizzardi CR63 — profilo' },\n    { src: 'uploads/scarab/1000549303.jpg', alt: 'Scarab in navigazione' },\n    { src: 'uploads/scarab/1000549299.jpg', alt: 'Scarab lungo la costa rocciosa' },\n    { src: 'uploads/scarab/1000549302.jpg', alt: 'Scarab in acque cristalline' },\n  ];\n\n  componentDidMount() {\n    this._sliderTimer = setInterval(() => {\n      this.setState((s) => ({ slide: (s.slide + 1) % this.heroPhotos.length }));\n    }, 5000);\n  }\n\n  componentWillUnmount() {\n    clearInterval(this._sliderTimer);\n  }\n\n  goToSlide = (i) => this.setState({ slide: i });\n\n  galleries = {\n    cr63: [\n      { src: 'uploads/fwdrizzardicr63/1000554483.jpg', alt: 'Rizzardi CR63 — prendisole di prua' },\n      { src: 'uploads/fwdrizzardicr63/1000554492.jpg', alt: \"Rizzardi CR63 all'ormeggio\" },\n      { src: 'uploads/fwdrizzardicr63/1000522453.jpg', alt: 'Rizzardi CR63 — profilo' },\n      { src: 'uploads/fwdrizzardicr63/1000554487.jpg', alt: 'Rizzardi CR63 — pozzetto' },\n      { src: 'uploads/fwdrizzardicr63/1000554490.jpg', alt: 'Rizzardi CR63 — interni' },\n      { src: 'uploads/fwdrizzardicr63/1000554494.jpg', alt: 'Rizzardi CR63 — dettaglio di bordo' },\n      { src: 'uploads/fwdrizzardicr63/1000554497.jpg', alt: 'Rizzardi CR63 — vista di poppa' },\n      { src: 'uploads/fwdrizzardicr63/1000522459.jpg', alt: 'Rizzardi CR63 in navigazione' },\n    ],\n    bat: [\n      { src: 'uploads/3.jpeg', alt: 'Gommone BAT in navigazione' },\n      { src: 'uploads/1.jpeg', alt: 'Gommone BAT — vista aerea con scia' },\n      { src: 'uploads/2.jpeg', alt: 'Gommone BAT dall\\'alto' },\n      { src: 'uploads/5.jpeg', alt: 'Gommone BAT — pozzetto e prendisole' },\n      { src: 'uploads/6.jpeg', alt: 'Gommone BAT sull\\'onda' },\n      { src: 'uploads/4.jpeg', alt: 'Gommone BAT — timone in carbonio' },\n      { src: 'uploads/7.jpg', alt: 'Gommone BAT — postazione di comando' },\n    ],\n    scarab: [\n      { src: 'uploads/scarab/1000549303.jpg', alt: 'Scarab in navigazione' },\n      { src: 'uploads/scarab/1000549299.jpg', alt: 'Scarab lungo la costa rocciosa' },\n      { src: 'uploads/scarab/1000549302.jpg', alt: 'Scarab in acque cristalline' },\n      { src: 'uploads/scarab/1000549300.jpg', alt: 'Scarab — dettaglio di bordo' },\n      { src: 'uploads/scarab/1000549304.jpg', alt: 'Scarab — pozzetto' },\n      { src: 'uploads/scarab/1000549305.jpg', alt: 'Scarab all\\'ormeggio' },\n    ],\n  };\n\n  pick = (key, i) => this.setState({ ['g_' + key]: i });\n\n  gallery(key, ratio, extra) {\n    const photos = this.galleries[key];\n    const active = this.state['g_' + key] || 0;\n    const cur = photos[active];\n    return {\n      src: cur.src,\n      alt: cur.alt,\n      mainStyle: {\n        display: 'block', width: '100%', aspectRatio: ratio,\n        backgroundImage: 'url(' + cur.src + ')', backgroundSize: 'cover', backgroundPosition: 'center',\n        ...(extra || {}),\n      },\n      thumbs: photos.map((p, i) => ({\n        onClick: () => this.pick(key, i),\n        style: {\n          border: 'none', padding: 0, cursor: 'pointer', aspectRatio: '1', width: '100%',\n          backgroundImage: 'url(' + p.src + ')', backgroundSize: 'cover', backgroundPosition: 'center',\n          opacity: i === active ? 1 : 0.45, transition: 'opacity .2s ease',\n        },\n      })),\n    };\n  }\n\n  destinations = [\n    { name: 'Capri', desc: 'Acque cristalline, grotte naturali e la vista sui Faraglioni.' },\n    { name: 'Positano', desc: \"Un borgo dal fascino riconoscibile, colori unici lungo la roccia.\" },\n    { name: 'Amalfi', desc: 'Storia, cultura e panorami distintivi nel cuore della Costiera.' },\n    { name: 'Nerano', desc: 'Un angolo meno battuto, apprezzato da chi conosce già la zona.' },\n    { name: 'Li Galli', desc: 'Un piccolo arcipelago legato a leggende antiche, tra natura e relax.' },\n  ];\n\n  experiences = ['Pranzo a bordo', 'Aperitivo al tramonto', 'Eventi privati', 'Proposte di matrimonio', 'Feste di compleanno', 'Transfer esclusivi'];\n\n  handleSubmit = (e) => {\n    e.preventDefault();\n    this.setState({ submitted: true });\n  };\n\n  renderVals() {\n    const heroImages = this.heroPhotos.map((p, i) => ({\n      src: p.src,\n      alt: p.alt,\n      style: {\n        position: 'absolute', inset: 0, width: '100%', height: '100%',\n        backgroundImage: 'url(' + p.src + ')', backgroundSize: 'cover', backgroundPosition: 'center',\n        opacity: i === this.state.slide ? 1 : 0, transition: 'opacity 1.2s ease',\n      },\n    }));\n    const dots = this.heroPhotos.map((_, i) => ({\n      onClick: () => this.goToSlide(i),\n      style: {\n        width: '8px', height: '8px', borderRadius: '50%', border: 'none', padding: 0, cursor: 'pointer',\n        background: i === this.state.slide ? '#f2f2f3' : 'color-mix(in srgb, #f2f2f3 40%, transparent)',\n      },\n    }));\n    return {\n      destinations: this.destinations,\n      experiences: this.experiences,\n      submitted: this.state.submitted,\n      handleSubmit: this.handleSubmit,\n      heroImages,\n      dots,\n      cr63: this.gallery('cr63', 'auto', { flex: '1 1 auto', minHeight: '320px' }),\n      scarab: this.gallery('scarab', '4 / 3'),\n      bat: this.gallery('bat', '4 / 3'),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
